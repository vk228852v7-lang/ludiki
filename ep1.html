:root{

  --chrome:#2A2C30; --chrome-fg:#EDEEF0; --chrome-muted:#9A9EA6; --chrome-hover:#3A3D42;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#151618; --surface:#1D1E21; --fg:#E9EAEC; --muted:#8E929A; --line:#2B2D31; --chrome:#202225; --chrome-hover:#2E3034; --btn:#E9EAEC; --btn-fg:#1A1B1E; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#151618; --surface:#1D1E21; --fg:#E9EAEC; --muted:#8E929A; --line:#2B2D31; --chrome:#202225; --chrome-hover:#2E3034; --btn:#E9EAEC; --btn-fg:#1A1B1E; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
.page{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px;display:flex;flex-direction:column;gap:24px;min-height:100vh}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{margin:0;font-weight:600;font-size:15px;letter-spacing:.32em;text-transform:uppercase}
.sub{margin:0;font-size:14px;color:var(--muted)}
.sub a{color:var(--fg);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
.sub a:hover{border-color:var(--fg)}
.player{border-radius:10px;overflow:hidden;background:var(--chrome);border:1px solid var(--line)}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--stage-bg);container-type:inline-size;cursor:pointer;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.player:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0;border:0;background:#000}
.player:fullscreen .stage{width:min(100vw,calc((100vh - 60px) * 16 / 9));margin-inline:auto}
.poster{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:1.2cqw;padding:4cqw;background:linear-gradient(180deg,rgba(24,25,28,0) 50%,var(--scrim) 100%);color:#fff;cursor:default}
.poster p{margin:0}

.bigplay svg{width:1.05em;height:1.05em;fill:currentColor}
.bigplay:hover{opacity:.9}
.bigplay:focus-visible{outline:2px solid #fff;outline-offset:3px}

<script>
(function(){
try{
'use strict';
const $=id=>document.getElementById(id);
const stage=$('stage'), canvas=$('scene'), posterEl=$('poster'), startBtn=$('start'), startLabel=$('startLabel'), posterEp=$('posterEp');

const DUR=26, POSTER_T=21.9;
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function fail(msg){ const d=document.createElement('div'); d.className='fail'; d.textContent=msg; stage.appendChild(d); posterEl.hidden=true; }
if(!window.THREE){ fail('Не удалось загрузить three.js. Проверьте интернет и обновите страницу.'); return; }

/* ---------- helpers ---------- */
const TAU=Math.PI*2;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const lerp=(a,b,k)=>a+(b-a)*k;

const win=(t,a,b,fi,fo)=>sm(seg(t,a,a+fi))*(1-sm(seg(t,b-fo,b)));

function trA(keys,t){

function spd(keys,t){ const a=tr(keys,t,true), b=tr(keys,t+0.05,true); return Math.hypot(b[0]-a[0],b[1]-a[1])/0.05; }
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const camera=new THREE.PerspectiveCamera(40,16/9,0.1,200);
function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); return new THREE.CanvasTexture(c); }
const grad=canvasTex(3,1,g=>{ ['#7a7a7a','#c4c4c4','#ffffff'].forEach((c,i)=>{g.fillStyle=c; g.fillRect(i,0,1,1);}); });
grad.minFilter=grad.magFilter=THREE.NearestFilter; grad.generateMipmaps=false;

const basic=(color,extra)=>new THREE.MeshBasicMaterial(Object.assign({color},extra||{}));
const OUT=new THREE.MeshBasicMaterial({color:0x221C24,side:THREE.BackSide});

scene.add(new THREE.HemisphereLight(0xFFFFFF,0xF2EEE6,0.6));
const key=new THREE.DirectionalLight(0xFFFFFF,0.55);
key.position.set(4,12,10); key.target.position.set(0,1,-1);
key.castShadow=true; key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-15,right:15,top:15,bottom:-15,near:1,far:50});
key.shadow.bias=-0.0006; key.shadow.normalBias=0.02;
scene.add(key,key.target);

// paintable wall
const WALL={w:26,h:13,z:-3};
const PW=1024, PH=512;
const pc=document.createElement('canvas'); pc.width=PW; pc.height=PH; const pg=pc.getContext('2d');
const paintTex=new THREE.CanvasTexture(pc);
const wx=x=>(x+WALL.w/2)/WALL.w*PW, wy=y=>(WALL.h-y)/WALL.h*PH, ws=u=>u/WALL.w*PW;
const wall=new THREE.Mesh(new THREE.PlaneGeometry(WALL.w,WALL.h),toon(0xFFFFFF,{map:paintTex}));
wall.position.set(0,WALL.h/2,WALL.z); wall.receiveShadow=true; scene.add(wall);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,40),toon(0xFFFFFF));
floor.rotation.x=-Math.PI/2; floor.position.set(0,0,WALL.z+20); floor.receiveShadow=true; scene.add(floor);

/* ---------- characters ---------- */
function curls(head,mat,mat2,center,rad,rows,cr){
  rows.forEach(([e,a0,a1,n],ri)=>{ for(let i=0;i<n;i++){ const a=n===1?0:lerp(a0,a1,i/(n-1)); const d=[Math.sin(a)*Math.cos(e),Math.sin(e),Math.cos(a)*Math.cos(e)];
    part(GEO.sphLo,(i+ri)%2?mat2:mat,head,{p:[center[0]+d[0]*rad,center[1]+d[1]*rad,center[2]+d[2]*rad],s:cr*(0.9+((i*7+ri*3)%5)*0.05),o:1.1}); } });

function makeKid(c){
  const R={c}; R.root=group(scene); R.base=c.scale||1; R.root.scale.setScalar(R.base);

  part(GEO.sph,skin,R.head,{s:[0.58,0.6,0.56]});
  for(const sx of [-1,1]){
    part(GEO.sph,skin,R.head,{p:[0.56*sx,-0.02,0.02],s:[0.09,0.13,0.07],o:1.12});
    part(GEO.sph,BLUSH,R.head,{p:[0.36*sx,-0.14,0.44],s:[0.09,0.05,0.03],o:0,cast:false});
  }
  part(GEO.sph,toon(c.skinDark),R.head,{p:[0,-0.08,0.56],s:[0.065,0.075,0.06],o:1.12});
  R.eyes=[];
  for(const sx of [-1,1]){ const e=group(R.head,[0.2*sx,0.04,0.5]); part(GEO.sph,INK,e,{s:[0.072,0.105,0.04],o:0,cast:false}); part(GEO.sphLo,WHITE,e,{p:[0.025,0.04,0.034],s:0.022,o:0,cast:false}); R.eyes.push(e); }

    part(GEO.sph,skin,a,{p:[0,-0.64,0.02],s:0.12});

  R.legY=0.82; R.legA=group(R.root,[0.2,R.legY,0]); R.legB=group(R.root,[-0.2,R.legY,0]);

}
// A: dark straight hair with a long side-swept fringe, black jacket over a white tee, earbud
const KA=makeKid({skin:0xF1CBAA,skinDark:0xE2AE8C,top:0x262A31,pants:0x30394A,shoe:0xF4F4F4,brow:0x3A2619,browT:0.035,browTilt:0.05,mouth:'flat',lids:true,
  build(R,m){ const h=toon(0x3A2619), h2=toon(0x4B3222), H=R.head;
    part(GEO.sph,h,H,{p:[0,0.2,-0.1],s:[0.62,0.56,0.58]});
    part(GEO.sph,h,H,{p:[0,-0.04,-0.36],s:[0.52,0.44,0.3]});
    for(const sx of [-1,1]) part(GEO.sph,h,H,{p:[0.52*sx,0.1,0.0],s:[0.14,0.3,0.32]});
    part(GEO.sph,h,H,{p:[0.02,0.34,0.4],s:[0.52,0.17,0.2],r:[0.25,0,-0.28]});
    part(GEO.sph,h2,H,{p:[0.34,0.22,0.4],s:[0.24,0.18,0.17],r:[0.2,0,-0.65]});
    part(GEO.sph,h2,H,{p:[-0.3,0.4,0.3],s:[0.26,0.14,0.2],r:[0.3,0,0.2]});

function drawPaint(t){

    const stroke=(w,col,dx)=>{ pg.strokeStyle=col; pg.lineWidth=w; pg.beginPath(); pts.forEach((p,i)=>i?pg.lineTo(p[0]+dx,p[1]):pg.moveTo(p[0]+dx,p[1])); pg.stroke(); };

    S.spikes.forEach(s=>{ pg.save(); pg.translate(cx,cy); pg.rotate(s.a); pg.beginPath(); pg.ellipse(R*s.d,0,R*s.l,R*s.w,0,0,TAU); pg.fill(); pg.restore(); });

    seek(T){ idx=0; while(idx<EV.length&&EV[idx].t<T) idx++; },
    tick(T){ if(!ctx) return; const now=ctx.currentTime; while(idx<EV.length&&EV[idx].t<=T+0.12){ const e=EV[idx]; if(e.t>=T-0.06){ try{ PLAY[e.k](now+Math.max(0,e.t-T),e); }catch(err){} } idx++; } },
    setMuted(m){ muted=m; if(ctx&&master) master.gain.setTargetAtTime(m?0:0.85,ctx.currentTime,0.05); },
    renderOffline(sr){ // whole soundtrack in one go (used to bake audio/epN.mp3)
      const live=[ctx,master,noiseBuf]; const oc=new OfflineAudioContext(2,Math.ceil(sr*DUR),sr); ctx=oc;
      master=oc.createGain(); master.gain.value=0.85; const comp=oc.createDynamicsCompressor(); master.connect(comp); comp.connect(oc.destination);
      const len=sr*3; noiseBuf=oc.createBuffer(1,len,sr); const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      EV.forEach(e=>{ try{ PLAY[e.k](Math.max(0,e.t),e); }catch(err){} });
      [ctx,master,noiseBuf]=live;
      return oc.startRendering();
    }
  };
})();

/* ---------- soundtrack file ----------
   iPhone mutes Web Audio when the ring/silent switch is off, so the episode plays a pre-rendered
   track through a normal <audio> element (that plays like video sound) and the picture follows its clock.
   If the file can't load or play, we fall back to the live Web Audio engine. */
const Track=(function(){
  const a=new Audio(); let ok=true, wait=0;
  a.preload='auto'; a.setAttribute('playsinline',''); a.src='audio/ep1.mp3';
  a.addEventListener('error',()=>{ ok=false; });
  return {
    get on(){ return ok; },
    start(t){ if(!ok) return false; try{ a.currentTime=t; }catch(e){} wait=0;
      const p=a.play(); if(p&&p.catch) p.catch(()=>{ ok=false; try{ AudioEngine.init(); AudioEngine.seek(T); }catch(e){} }); return true; },
    stop(){ try{ a.pause(); }catch(e){} },
    seek(t){ if(ok) try{ a.currentTime=t; }catch(e){} },
    mute(m){ a.muted=m; },
    clock(t,dt){ if(!ok) return t+dt;
      if(!a.paused&&a.readyState>=2&&a.currentTime>0){ wait=0; const c=a.currentTime; if(Math.abs(c-t)>0.35){ try{ a.currentTime=t; }catch(e){} return t+dt; } return c; }
      wait+=dt; return wait>1.5?t+dt:t; }
  };
})();

/* ---------- playback ---------- */
let T=0, playing=false, last=performance.now(), dirty=true, scrubbing=false, muted=false, posterVisible=true;
const PLAY_D='M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z', PAUSE_D='M6 4h4v16H6zM14 4h4v16h-4z';
const fmt=s=>{ s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const beatBtns=[...document.querySelectorAll('#beats button')];
const ticks=$('ticks'); beatBtns.slice(1).forEach(b=>{ const i=document.createElement('i'); i.style.left=(parseFloat(b.dataset.t)/DUR*100)+'%'; ticks.appendChild(i); });
function render(){
  const t=posterVisible?POSTER_T:T;
  poseA(t); poseB(t); poseC(t); poseProps(t); drawPaint(t); cameraAt(t);
  renderer.render(scene,camera);
  timeEl.innerHTML='<b>'+fmt(T)+'</b> / 0:26';
  if(!scrubbing) scrub.value=Math.round(T*10);
  let cur=0; beatBtns.forEach((b,i)=>{ if(T>=parseFloat(b.dataset.t)-0.01) cur=i; });
  beatBtns.forEach((b,i)=>b.setAttribute('aria-current',(!posterVisible&&i===cur)?'true':'false'));
}
function setPlaying(p){
  playing=p; playIcon.setAttribute('d',p?PAUSE_D:PLAY_D); playBtn.setAttribute('aria-label',p?'Пауза':'Смотреть');
  if(p){ if(!Track.start(T)){ try{ AudioEngine.init(); AudioEngine.seek(T); }catch(e){} } posterVisible=false; posterEl.hidden=true; last=performance.now(); }
  else Track.stop();
  dirty=true;
}
function play(){ if(T>=DUR-0.01) T=0; setPlaying(true); }
function pause(){ setPlaying(false); }
function seek(t){ T=clamp(t,0,DUR); AudioEngine.seek(T); Track.seek(T); if(posterVisible){ posterVisible=false; posterEl.hidden=true; } dirty=true; }
function frame(now){
  const dt=Math.min((now-last)/1000,0.1); last=now;
  if(playing){ T=Math.min(DUR,Track.clock(T,dt)); if(!Track.on) AudioEngine.tick(T); if(T>=DUR){ setPlaying(false); posterEp.textContent="Конец"; startLabel.textContent='Смотреть ещё раз'; posterVisible=true; posterEl.hidden=false; } dirty=true; }
  if(dirty){ dirty=false; try{ render(); }catch(e){ window.__report('кадр: '+((e&&e.message)||e)); } }
  requestAnimationFrame(frame);
}
startBtn.addEventListener('click',e=>{ e.stopPropagation(); if(T>=DUR-0.01) T=0; play(); });
posterEl.addEventListener('click',e=>{ if(e.target===posterEl){ if(T>=DUR-0.01) T=0; play(); } });
stage.addEventListener('click',e=>{ if(posterEl.contains(e.target)) return; playing?pause():play(); });
playBtn.addEventListener('click',()=>{ playing?pause():play(); });
scrub.addEventListener('input',()=>{ scrubbing=true; seek(scrub.value/10); });
scrub.addEventListener('change',()=>{ scrubbing=false; });
soundBtn.addEventListener('click',()=>{ muted=!muted; AudioEngine.setMuted(muted); Track.mute(muted); soundBtn.setAttribute('aria-pressed',String(muted)); soundBtn.setAttribute('aria-label',muted?'Включить звук':'Выключить звук'); soundIcon.setAttribute('d',muted?'M4 9h3.5L12 5v14l-4.5-4H4zM16 9l5 6M21 9l-5 6':'M4 9h3.5L12 5v14l-4.5-4H4zM15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12'); });
if(!(document.fullscreenEnabled&&playerEl.requestFullscreen)) fsBtn.hidden=true;
fsBtn.addEventListener('click',()=>{ try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else { const r=playerEl.requestFullscreen(); if(r&&r.catch) r.catch(()=>{}); } }catch(e){} });
beatBtns.forEach(b=>b.addEventListener('click',()=>{ seek(parseFloat(b.dataset.t)); play(); }));
document.addEventListener('keydown',e=>{
  const tag=e.target&&e.target.tagName;
  if(tag==='TEXTAREA'||(tag==='INPUT'&&e.target.type!=='range')) return;
  if(e.code==='Space'&&tag!=='BUTTON'){ e.preventDefault(); playing?pause():play(); }
  else if(e.code==='ArrowRight'&&e.target===document.body) seek(T+2);
  else if(e.code==='ArrowLeft'&&e.target===document.body) seek(T-2);
});

function resize(){ const w=stage.clientWidth, h=stage.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); dirty=true; }
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize',resize);
resize();
window.__renderAudio=function(sr){ return AudioEngine.renderOffline(sr||44100).then(buf=>{ const L=buf.getChannelData(0), R=buf.getChannelData(1), n=L.length, out=new Int16Array(n*2);
  for(let i=0;i<n;i++){ out[2*i]=Math.max(-1,Math.min(1,L[i]))*32767; out[2*i+1]=Math.max(-1,Math.min(1,R[i]))*32767; }
  const u8=new Uint8Array(out.buffer); let bin=''; for(let i=0;i<u8.length;i+=0x8000) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(bin); }); };
window.__seek=function(t){ posterVisible=false; posterEl.hidden=true; T=t; render(); };
requestAnimationFrame(frame);
}catch(err){ window.__report((err&&err.message)||String(err)); }
})();
</script>
</body>
</html>
