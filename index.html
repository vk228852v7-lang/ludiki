<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="LUDIKI — все серии мультфильма в одном месте: переключайтесь между сериями, не покидая страницу.">
<meta name="theme-color" content="#ECEDEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151618" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="LUDIKI — все серии">
<meta property="og:description" content="Мультфильм ЛУДИКИ: серии 1–4 на одной странице.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232A2C30'/%3E%3Cpath d='M24 18v28l22-14z' fill='%23F6F6F7'/%3E%3C/svg%3E">
<title>LUDIKI — все серии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"></noscript>
<style>
html{color-scheme:light}
body{margin:0}
/* Minimal grey page: small wordmark, one 16:9 player, one line of footer */
:root{
  --bg:#ECEDEF; --surface:#F6F6F7; --fg:#1F2124; --muted:#6B6F76; --line:#D8DADE;
  --chrome:#2A2C30; --chrome-fg:#EDEEF0; --chrome-muted:#9A9EA6; --chrome-hover:#3A3D42;
  --btn:#2A2C30; --btn-fg:#F6F6F7; --scrim:rgba(24,25,28,.62); --stage-bg:#FFFFFF;
  --font:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#151618; --surface:#1D1E21; --fg:#E9EAEC; --muted:#8E929A; --line:#2B2D31; --chrome:#202225; --chrome-hover:#2E3034; --btn:#E9EAEC; --btn-fg:#1A1B1E; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#151618; --surface:#1D1E21; --fg:#E9EAEC; --muted:#8E929A; --line:#2B2D31; --chrome:#202225; --chrome-hover:#2E3034; --btn:#E9EAEC; --btn-fg:#1A1B1E; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
.page{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px;display:flex;flex-direction:column;gap:24px;min-height:100vh}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{margin:0;font-weight:600;font-size:15px;letter-spacing:.32em;text-transform:uppercase}
.sub{margin:0;font-size:14px;color:var(--muted)}
.sub a{color:var(--fg);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
.sub a:hover{border-color:var(--fg)}
.player{border-radius:10px;overflow:hidden;background:var(--chrome);border:1px solid var(--line)}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--stage-bg);container-type:inline-size;cursor:pointer;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.player:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0;border:0;background:#000}
.player:fullscreen .stage{width:min(100vw,calc((100vh - 60px) * 16 / 9));margin-inline:auto}
.poster{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:1.2cqw;padding:4cqw;background:linear-gradient(180deg,rgba(24,25,28,0) 50%,var(--scrim) 100%);color:#fff;cursor:default}
.poster p{margin:0}
.poster .ep{font-weight:500;letter-spacing:.16em;text-transform:uppercase;font-size:clamp(10px,1.3cqw,14px);opacity:.9}
.bigplay{display:inline-flex;align-items:center;gap:.6em;border:0;border-radius:999px;background:var(--btn);color:var(--btn-fg);font:600 clamp(14px,1.8cqw,19px)/1 var(--font);padding:.85em 1.4em .85em 1.1em;cursor:pointer}
.bigplay svg{width:1.05em;height:1.05em;fill:currentColor}
.bigplay:hover{opacity:.9}
.bigplay:focus-visible{outline:2px solid #fff;outline-offset:3px}
.fail{position:absolute;inset:0;display:grid;place-content:center;padding:24px;text-align:center;background:var(--chrome);color:var(--chrome-fg);font-weight:500}
.controls{display:flex;align-items:center;gap:10px 14px;padding:8px 12px 10px;color:var(--chrome-fg);background:var(--chrome)}
.ctl{flex:none;display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:8px;background:transparent;color:var(--chrome-fg);cursor:pointer}
.ctl svg{width:21px;height:21px;fill:currentColor}
.ctl:hover{background:var(--chrome-hover)}
.ctl:focus-visible{outline:2px solid var(--chrome-fg);outline-offset:1px}
.time{flex:none;font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;color:var(--chrome-muted);min-width:7.6ch}
.time b{color:var(--chrome-fg);font-weight:600}
.scrub{position:relative;flex:1;min-width:0;height:38px;display:flex;align-items:center}
.scrub input{width:100%;margin:0;accent-color:var(--chrome-fg);cursor:pointer}
.ticks{display:none}
.foot{margin:auto 0 0;font-size:13px;color:var(--muted)}
@media (hover:none){ .foot{display:none} }
@media (max-width:520px){ .controls{flex-wrap:wrap;padding:6px 8px 8px} .scrub{order:-1;flex-basis:100%} .time{margin-right:auto} .player{border-radius:8px} }


.top{align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px/1 var(--font);padding:12px 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:baseline;gap:8px;transition:background .15s,color .15s,border-color .15s}
.tab small{font-weight:500;font-size:12px;color:var(--muted)}
.tab:hover{border-color:var(--muted)}
.tab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.tab[aria-selected="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.tab[aria-selected="true"] small{color:inherit;opacity:.7}
.view{display:flex;flex-direction:column;gap:12px}
.meta{margin:0;font-size:14px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
#frame{display:block;width:100%;border:0;background:transparent;color-scheme:normal}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav button{appearance:none;border:0;background:none;color:var(--fg);font:600 14px/1 var(--font);padding:8px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.nav button:hover{border-color:var(--fg)}
.nav button[hidden]{display:none}
@media (max-width:520px){ .tabs{gap:6px} .tab{padding:11px 12px;font-size:14px} .tab small{display:none} }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1 class="brand">Ludiki</h1>
    <p class="sub" id="sub">Все серии на одной странице</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Серии"><button class="tab" role="tab" id="tab1" data-ep="1" aria-selected="false" aria-controls="view"><span>Серия 1</span></button><button class="tab" role="tab" id="tab2" data-ep="2" aria-selected="false" aria-controls="view"><span>Серия 2</span></button><button class="tab" role="tab" id="tab3" data-ep="3" aria-selected="false" aria-controls="view"><span>Серия 3</span></button><button class="tab" role="tab" id="tab4" data-ep="4" aria-selected="false" aria-controls="view"><span>Серия 4</span></button></nav>

  <section class="view" id="view" role="tabpanel">
    <p class="meta" id="meta"></p>
    <iframe id="frame" title="Плеер LUDIKI" allow="fullscreen; autoplay" allowfullscreen scrolling="no"></iframe>
    <div class="nav"><button type="button" id="prev" hidden></button><button type="button" id="next" hidden></button></div>
  </section>

  <p class="foot">Серию можно переключить в любой момент — страница остаётся на месте.</p>
</div>
<script>
(function(){
var EPS=[{"n": 1, "name": "Заставка", "dur": "26 секунд", "src": "ep1.html"}, {"n": 2, "name": "«Экспресс»", "dur": "34 секунды", "src": "ep2.html"}, {"n": 3, "name": "", "dur": "2 минуты 7 секунд", "src": "ep3.html"}, {"n": 4, "name": "", "dur": "1 минута 33 секунды", "src": "ep4.html"}];
var frame=document.getElementById('frame'), meta=document.getElementById('meta'), prev=document.getElementById('prev'), next=document.getElementById('next');
var cur=0;
function ratioH(){ return Math.round(frame.getBoundingClientRect().width*9/16)+58; }
function fromHash(){ var m=/^#?ep(\d+)$/.exec(location.hash); var n=m?+m[1]:1; return EPS.some(function(e){return e.n===n})?n:1; }
function show(n,push){
  var e=EPS.filter(function(x){return x.n===n})[0]; if(!e) return;
  cur=n;
  EPS.forEach(function(x){ var t=document.getElementById('tab'+x.n); t.setAttribute('aria-selected',x.n===n); t.tabIndex=x.n===n?0:-1; });
  meta.innerHTML='<b>Серия '+n+'</b>'+(e.name?' · '+e.name:'')+' · '+e.dur;
  document.title='LUDIKI — серия '+n;
  frame.style.height=ratioH()+'px';
  frame.src=e.src+'?embed';
  var p=EPS.filter(function(x){return x.n===n-1})[0], q=EPS.filter(function(x){return x.n===n+1})[0];
  prev.hidden=!p; next.hidden=!q;
  if(p) prev.textContent='← Серия '+p.n; if(q) next.textContent='Серия '+q.n+' →';
  if(push!==false){ try{ history.replaceState(null,'','#ep'+n); }catch(_){ location.hash='ep'+n; } }
}
EPS.forEach(function(x){ document.getElementById('tab'+x.n).addEventListener('click',function(){ if(cur!==x.n) show(x.n); }); });
document.querySelector('.tabs').addEventListener('keydown',function(ev){
  if(ev.key!=='ArrowRight'&&ev.key!=='ArrowLeft') return;
  var n=cur+(ev.key==='ArrowRight'?1:-1); if(n<1||n>EPS.length) return;
  show(n); document.getElementById('tab'+n).focus(); ev.preventDefault();
});
prev.addEventListener('click',function(){ show(cur-1); window.scrollTo({top:0,behavior:'smooth'}); });
next.addEventListener('click',function(){ show(cur+1); window.scrollTo({top:0,behavior:'smooth'}); });
window.addEventListener('message',function(ev){
  if(ev.source!==frame.contentWindow||!ev.data) return;
  if(ev.data.ludiki==='height'&&ev.data.h) frame.style.height=ev.data.h+'px';
});
window.addEventListener('hashchange',function(){ var n=fromHash(); if(n!==cur) show(n,false); });
window.addEventListener('resize',function(){ if(!frame.dataset.h) frame.style.minHeight=''; });
show(fromHash(),false);
})();
</script>
</body>
</html>
